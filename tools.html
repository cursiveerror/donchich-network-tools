<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools - Donchich Network Tools</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Donchich Tools</h2>
            <nav>
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="tools.html" class="nav-link active">Tools</a>
            </nav>
            <div style="margin-top: auto;">
                <button class="btn-outline" style="width: 100%;" id="openSettingsBtn">Settings</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h1>Network Tools</h1>
            </header>

            <div class="grid">
                <!-- Port Scanner Card -->
                <div class="card" style="grid-column: span 1;">
                    <span class="card-title">Port Scanner</span>
                    <p class="text-muted" style="font-size: 13px;">Scan common ports to check if they are open on a target host.</p>
                    
                    <div class="form-group">
                        <label class="form-label">Target Host</label>
                        <input type="text" id="portHostInput" placeholder="e.g. google.com or 8.8.8.8">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Ports (comma separated)</label>
                        <input type="text" id="portListInput" value="80,443,21,22,3306" placeholder="80, 443...">
                    </div>

                    <button class="btn-primary" id="scanPortsBtn">Scan Ports</button>
                    
                    <div class="result-box d-none" id="portResultBox"></div>
                </div>

                <!-- DNS Lookup Card -->
                <div class="card" style="grid-column: span 1;">
                    <span class="card-title">DNS Lookup</span>
                    <p class="text-muted" style="font-size: 13px;">Query A, MX, and TXT records for a specific domain name.</p>
                    
                    <div class="form-group">
                        <label class="form-label">Domain Name</label>
                        <input type="text" id="dnsHostInput" placeholder="e.g. github.com">
                    </div>
                    
                    <button class="btn-primary" id="scanDnsBtn" style="margin-top: auto;">Lookup DNS</button>
                    
                    <div class="result-box d-none" id="dnsResultBox"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="btn-icon" id="closeSettingsBtn">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Speed Units</label>
                    <select id="settingSpeedUnit">
                        <option value="Mbps">Mbps (Megabits per second)</option>
                        <option value="MB/s">MB/s (Megabytes per second)</option>
                        <option value="Kbps">Kbps (Kilobits per second)</option>
                        <option value="Gbps">Gbps (Gigabits per second)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Test Payload Size</label>
                    <select id="settingPayloadSize">
                        <option value="10">Small (10 MB)</option>
                        <option value="50">Medium (50 MB)</option>
                        <option value="100">Large (100 MB)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Default Ping Host</label>
                    <input type="text" id="settingPingHost" placeholder="e.g. google.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Port Scan Timeout (Seconds)</label>
                    <div class="slider-container">
                        <input type="range" class="slider" id="settingPortTimeout" min="1" max="5" value="2">
                        <span id="portTimeoutValDisplay">2s</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Theme</label>
                    <select id="settingTheme">
                        <option value="system">System</option>
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelSettingsBtn">Cancel</button>
                <button class="btn-primary" id="saveSettingsBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="js/tools.js"></script>
</body>
</html>
